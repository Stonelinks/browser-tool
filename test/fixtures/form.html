<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Form Test</title>
</head>
<body>
  <header>
    <h1>Search Demo</h1>
  </header>
  <main>
    <form id="search-form" action="/results" method="get">
      <label for="q">Query</label>
      <input id="q" name="q" type="text" placeholder="Type your query" />
      <button id="submit-btn" type="submit">Search</button>
    </form>
    <p id="info">Welcome to the search demo.</p>
    <a href="/about">About</a>
  </main>
</body>
</html>
